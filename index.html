<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to Prompt - By Buana Media</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0a0a0a',
            cardbg: 'rgba(255, 255, 255, 0.03)',
            bordercolor: 'rgba(125, 125, 125, 0.2)',
            accent: 'rgba(255, 255, 255, 0.9)',
            accenthover: 'rgba(255, 255, 255, 1)',
            brandblue: '#38bdf8',
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0a0a0a;
      color: currentColor;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-gray-200">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // API Keys Multi State
      const [apiKeys, setApiKeys] = useState([]);
      const [newKeyInput, setNewKeyInput] = useState('');
      const [showInputKeyText, setShowInputKeyText] = useState(false);
      const [visibleKeysMap, setVisibleKeysMap] = useState({});
      const [copiedKeyIndex, setCopiedKeyIndex] = useState(null);
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);

      // Input Mode & Media States
      const [inputMode, setInputMode] = useState('file'); // 'file', 'youtube', 'text'
      const [file, setFile] = useState(null);
      const [preview, setPreview] = useState(null);
      const [ytUrl, setYtUrl] = useState('');
      const [textInput, setTextInput] = useState('');
      
      // Custom Settings
      const [aspectRatio, setAspectRatio] = useState('16:9');
      const [extraInstructions, setExtraInstructions] = useState('');
      const [negativeStyling, setNegativeStyling] = useState('');
      const [promptStyle, setPromptStyle] = useState('general');
      
      // Processing & Output
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState(null);
      const [promptResult, setPromptResult] = useState('');
      const [copiedPrompt, setCopiedPrompt] = useState(false);
      const [history, setHistory] = useState([]);

      const fileInputRef = useRef(null);

      // Load Storage on Mount
      useEffect(() => {
        const savedKeys = localStorage.getItem('pv_api_keys');
        if (savedKeys) {
          try {
            const parsed = JSON.parse(savedKeys);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setApiKeys(parsed);
            } else {
              setShowApiKeyModal(true);
            }
          } catch(e) {
            setShowApiKeyModal(true);
          }
        } else {
          const legacyKey = localStorage.getItem('gemini_api_key');
          if (legacyKey) {
            setApiKeys([legacyKey]);
            localStorage.setItem('pv_api_keys', JSON.stringify([legacyKey]));
          } else {
            setShowApiKeyModal(true);
          }
        }

        const savedHistory = localStorage.getItem('pv_prompt_history');
        if (savedHistory) {
          try { setHistory(JSON.parse(savedHistory)); } catch(e){}
        }
      }, []);

      // Add New Key
      const handleAddKey = (e) => {
        e.preventDefault();
        const trimmed = newKeyInput.trim();
        if (!trimmed) return;

        if (apiKeys.includes(trimmed)) {
          alert('API Key ini sudah ada dalam daftar.');
          return;
        }

        const updated = [...apiKeys, trimmed];
        setApiKeys(updated);
        localStorage.setItem('pv_api_keys', JSON.stringify(updated));
        setNewKeyInput('');
        setError(null);
      };

      // Remove Single Key
      const handleRemoveKey = (index) => {
        const updated = apiKeys.filter((_, i) => i !== index);
        setApiKeys(updated);
        localStorage.setItem('pv_api_keys', JSON.stringify(updated));
      };

      // Toggle Key Visibility Mask
      const toggleKeyVisibility = (index) => {
        setVisibleKeysMap(prev => ({ ...prev, [index]: !prev[index] }));
      };

      // Copy Single Key
      const copyKeyToClipboard = (keyStr, index) => {
        navigator.clipboard.writeText(keyStr);
        setCopiedKeyIndex(index);
        setTimeout(() => setCopiedKeyIndex(null), 1500);
      };

      // Mask key helper (AQ.Ab8...3DSA)
      const maskKeyStr = (str) => {
        if (!str || str.length < 10) return '••••••••';
        return `${str.substring(0, 6)}...${str.substring(str.length - 4)}`;
      };

      // Handle Image File
      const handleFile = (selectedFile) => {
        setError(null);
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(selectedFile.type)) {
          setError('Format file tidak didukung! Gunakan JPG, PNG, atau WEBP.');
          return;
        }
        if (selectedFile.size > 20 * 1024 * 1024) {
          setError('Ukuran file maksimal 20MB.');
          return;
        }
        setFile(selectedFile);
        const reader = new FileReader();
        reader.onloadend = () => setPreview(reader.result);
        reader.readAsDataURL(selectedFile);
      };

      // Extract YouTube Thumbnail
      const extractYtThumbnail = () => {
        setError(null);
        if (!ytUrl) return;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = ytUrl.match(regExp);
        if (match && match[2].length === 11) {
          setPreview(`https://img.youtube.com/vi/${match[2]}/maxresdefault.jpg`);
        } else {
          setError('URL YouTube tidak valid.');
        }
      };

      // Execute AI Prompt Generation with Key Auto-Rotation Fallback
      const handleGenerate = async () => {
        if (apiKeys.length === 0) {
          setShowApiKeyModal(true);
          return;
        }

        if (inputMode === 'file' && !preview) {
          setError('Unggah gambar terlebih dahulu.');
          return;
        }
        if (inputMode === 'youtube' && !preview) {
          setError('Masukkan URL YouTube lalu ambil thumbnail.');
          return;
        }
        if (inputMode === 'text' && !textInput.trim()) {
          setError('Masukkan deskripsi atau konteks teks.');
          return;
        }

        setIsLoading(true);
        setError(null);
        setPromptResult('');

        try {
          let parts = [];

          if (inputMode !== 'text' && preview) {
            let base64Data = '';
            let mimeType = 'image/jpeg';

            if (preview.startsWith('data:')) {
              base64Data = preview.split(',')[1];
              mimeType = file ? file.type : 'image/jpeg';
            } else {
              const resp = await fetch(preview);
              const blob = await resp.blob();
              const reader = new FileReader();
              base64Data = await new Promise((resolve) => {
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
              });
              mimeType = blob.type || 'image/jpeg';
            }

            parts.push({
              inline_data: { mime_type: mimeType, data: base64Data }
            });
          }

          let styleText = '';
          if (promptStyle === 'midjourney') styleText = ` Format output specifically for Midjourney v6 with parameter --ar ${aspectRatio}.`;
          else if (promptStyle === 'flux') styleText = ` Format output optimized for Flux.1 with aspect ratio ${aspectRatio}.`;
          else if (promptStyle === 'sdxl') styleText = ` Format output as Stable Diffusion XL tags and details for ${aspectRatio} ratio.`;
          else styleText = ` Target aspect ratio for output image generation is ${aspectRatio}.`;

          let systemPrompt = `You are a professional AI prompt engineer. Analyze the visual or context in extreme detail.
Identify main subject, lighting, mood, color palette, camera angle, atmosphere, and artistic composition.${styleText}

Requirements:
- Output ONLY the highly detailed prompt.
- Do not include preamble, intro, or markdown wrapper blocks.`;

          if (extraInstructions.trim()) systemPrompt += `\nAdditional Custom Instructions: ${extraInstructions.trim()}`;
          if (negativeStyling.trim()) systemPrompt += `\nAvoid/Negative Elements: ${negativeStyling.trim()}`;
          if (inputMode === 'text' && textInput.trim()) systemPrompt += `\nBase Context/Text: ${textInput.trim()}`;

          parts.push({ text: systemPrompt });

          // Multi-Key Fallback Engine
          let finalResult = null;
          let lastErrorMessage = '';
          const modelsToTry = ['gemini-2.5-flash', 'gemini-1.5-flash', 'gemini-3.6-flash'];

          for (let k = 0; k < apiKeys.length; k++) {
            const currentKey = apiKeys[k];
            let keySuccess = false;

            for (const model of modelsToTry) {
              try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ contents: [{ parts }] })
                });

                if (res.ok) {
                  const data = await res.json();
                  finalResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
                  if (finalResult) {
                    keySuccess = true;
                    break;
                  }
                } else {
                  const errData = await res.json();
                  lastErrorMessage = errData.error?.message || `Key #${k+1} error status: ${res.status}`;
                }
              } catch (e) {
                lastErrorMessage = e.message;
              }
            }

            if (keySuccess && finalResult) break;
          }

          if (!finalResult) {
            throw new Error(lastErrorMessage || 'Seluruh API Key gagal digunakan atau rate limited.');
          }

          const trimmedOutput = finalResult.trim();
          setPromptResult(trimmedOutput);

          // Add to History
          const newHistory = [{ prompt: trimmedOutput, time: new Date().toLocaleTimeString() }, ...history.slice(0, 9)];
          setHistory(newHistory);
          localStorage.setItem('pv_prompt_history', JSON.stringify(newHistory));

        } catch (err) {
          setError(err.message || 'Terjadi kesalahan saat memproses prompt.');
        } finally {
          setIsLoading(false);
        }
      };

      const copyPromptText = (text) => {
        navigator.clipboard.writeText(text);
        setCopiedPrompt(true);
        setTimeout(() => setCopiedPrompt(false), 2000);
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Bar Navigation */}
          <header className="border-b border-bordercolor bg-[#0a0a0a]/90 backdrop-blur px-4 sm:px-8 py-3.5 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center space-x-3">
              {/* Logo Icon */}
              <div className="bg-white/10 border border-bordercolor p-2.5 rounded-xl text-white flex items-center justify-center shadow-sm">
                <i className="fa-solid fa-wand-magic-sparkles text-xl"></i>
              </div>
              <div>
                <h1 className="font-extrabold text-lg tracking-wide text-white flex items-center gap-2 leading-tight">
                  Image to Prompt
                </h1>
                <div className="flex items-center space-x-2 text-[11px] leading-snug">
                  <a 
                    href="https://www.buanamedia.my.id" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="text-gray-300 hover:text-white font-semibold hover:underline flex items-center gap-1"
                  >
                    <span>By Buana Media</span>
                    <i className="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                  </a>
                  <span className="text-gray-600">•</span>
                  <span className="text-gray-400">Generative AI Visual Prompt Builder</span>
                </div>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button
                onClick={() => setShowApiKeyModal(true)}
                className="text-xs bg-white/5 hover:bg-white/10 text-gray-200 border border-bordercolor px-3.5 py-2 rounded-xl transition font-semibold flex items-center gap-2"
              >
                <i className="fa-solid fa-key text-gray-300"></i>
                <span>{apiKeys.length} Key Tersimpan</span>
              </button>
            </div>
          </header>

          {/* Main Grid Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* LEFT COLUMN: INPUT CONTROLS */}
            <div className="lg:col-span-6 space-y-5">
              
              {/* Tab Mode Input */}
              <div className="bg-white/5 border border-bordercolor p-1.5 rounded-xl flex space-x-1">
                <button
                  onClick={() => { setInputMode('file'); setPreview(null); }}
                  className={`flex-1 py-2 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 ${inputMode === 'file' ? 'bg-white/20 text-white shadow border border-bordercolor' : 'text-gray-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-file-image"></i>
                  <span>File</span>
                </button>
                <button
                  onClick={() => { setInputMode('youtube'); setPreview(null); }}
                  className={`flex-1 py-2 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 ${inputMode === 'youtube' ? 'bg-white/20 text-white shadow border border-bordercolor' : 'text-gray-400 hover:text-white'}`}
                >
                  <i className="fa-brands fa-youtube"></i>
                  <span>YouTube</span>
                </button>
                <button
                  onClick={() => { setInputMode('text'); setPreview(null); }}
                  className={`flex-1 py-2 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2 ${inputMode === 'text' ? 'bg-white/20 text-white shadow border border-bordercolor' : 'text-gray-400 hover:text-white'}`}
                >
                  <i className="fa-solid fa-align-left"></i>
                  <span>Teks</span>
                </button>
              </div>

              {/* API Key Alert Banner */}
              {apiKeys.length === 0 && (
                <div 
                  onClick={() => setShowApiKeyModal(true)}
                  className="bg-white/10 border border-bordercolor rounded-xl p-3.5 text-xs text-gray-200 flex items-center justify-between cursor-pointer hover:bg-white/15 transition"
                >
                  <div className="flex items-center gap-2">
                    <i className="fa-solid fa-circle-exclamation text-base text-yellow-500"></i>
                    <span><strong>API Key Belum Dikonfigurasi.</strong> Klik untuk menambah key.</span>
                  </div>
                  <i className="fa-solid fa-chevron-right"></i>
                </div>
              )}

              {/* File Upload */}
              {inputMode === 'file' && (
                <div
                  onClick={() => fileInputRef.current?.click()}
                  className="border-2 border-dashed border-bordercolor hover:border-white/40 bg-white/5 rounded-2xl p-6 text-center cursor-pointer transition flex flex-col items-center justify-center min-h-[200px]"
                >
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])}
                    accept="image/jpeg,image/png,image/webp"
                    className="hidden"
                  />
                  {!preview ? (
                    <div className="space-y-2">
                      <div className="w-12 h-12 bg-white/10 border border-bordercolor rounded-xl text-white flex items-center justify-center mx-auto text-xl">
                        <i className="fa-solid fa-cloud-arrow-up"></i>
                      </div>
                      <p className="text-sm font-semibold text-white">Pilih, Tempel, atau Seret File</p>
                      <p className="text-xs text-gray-400">JPG, PNG, WEBP — Maks 20MB</p>
                    </div>
                  ) : (
                    <div className="relative w-full flex flex-col items-center">
                      <img src={preview} alt="Preview" className="max-h-48 rounded-lg border border-bordercolor object-contain" />
                      <button
                        type="button"
                        onClick={(e) => { e.stopPropagation(); setPreview(null); setFile(null); }}
                        className="mt-3 text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded-lg border border-red-500/30 hover:bg-red-500/30 transition"
                      >
                        Ganti Gambar
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* YouTube Input */}
              {inputMode === 'youtube' && (
                <div className="bg-white/5 border border-bordercolor rounded-2xl p-5 space-y-3">
                  <label className="text-xs font-semibold text-gray-300">URL Video YouTube</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={ytUrl}
                      onChange={(e) => setYtUrl(e.target.value)}
                      placeholder="https://www.youtube.com/watch?v=..."
                      className="flex-1 bg-black/50 border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white/50"
                    />
                    <button
                      onClick={extractYtThumbnail}
                      className="bg-white/20 hover:bg-white/30 text-white text-xs px-4 py-2.5 rounded-xl font-semibold border border-bordercolor transition"
                    >
                      Ambil
                    </button>
                  </div>
                  {preview && (
                    <div className="pt-2">
                      <img src={preview} alt="Thumbnail Preview" className="w-full h-40 object-cover rounded-xl border border-bordercolor" />
                    </div>
                  )}
                </div>
              )}

              {/* Text Input */}
              {inputMode === 'text' && (
                <div className="bg-white/5 border border-bordercolor rounded-2xl p-5 space-y-2">
                  <label className="text-xs font-semibold text-gray-300">Konstruksi Teks / Deskripsi Awal</label>
                  <textarea
                    rows="4"
                    value={textInput}
                    onChange={(e) => setTextInput(e.target.value)}
                    placeholder="Tuliskan ide awal atau skenario visual..."
                    className="w-full bg-black/50 border border-bordercolor rounded-xl p-3 text-xs text-white focus:outline-none focus:border-white/50"
                  ></textarea>
                </div>
              )}

              {/* Controls Form */}
              <div className="bg-white/5 border border-bordercolor rounded-2xl p-5 space-y-4">
                
                {/* Image Aspect Ratio Selection */}
                <div>
                  <label className="block text-xs font-semibold text-gray-300 mb-1.5 flex items-center gap-1.5">
                    <i className="fa-solid fa-crop-simple text-gray-400"></i>
                    <span>Ukuran Gambar (Aspect Ratio)</span>
                  </label>
                  <select
                    value={aspectRatio}
                    onChange={(e) => setAspectRatio(e.target.value)}
                    className="w-full bg-black/50 border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white/50"
                  >
                    <option value="16:9" className="bg-[#0a0a0a]">16:9 — Landscape (Youtube / Banner)</option>
                    <option value="9:16" className="bg-[#0a0a0a]">9:16 — Portrait (TikTok / Shorts / Reels)</option>
                    <option value="1:1" className="bg-[#0a0a0a]">1:1 — Square (Feed Instagram)</option>
                    <option value="4:5" className="bg-[#0a0a0a]">4:5 — Portrait (Post Social Media)</option>
                    <option value="21:9" className="bg-[#0a0a0a]">21:9 — Ultrawide (Cinematic Video)</option>
                    <option value="3:2" className="bg-[#0a0a0a]">3:2 — Standard DSLR Photo</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-gray-300 mb-1.5">Instruksi Tambahan</label>
                  <input
                    type="text"
                    value={extraInstructions}
                    onChange={(e) => setExtraInstructions(e.target.value)}
                    placeholder="Fokus pada pencahayaan cinematic, gaya cyber-punk..."
                    className="w-full bg-black/50 border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white/50"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-gray-300 mb-1.5">Negative Styling</label>
                  <input
                    type="text"
                    value={negativeStyling}
                    onChange={(e) => setNegativeStyling(e.target.value)}
                    placeholder="Tanpa teks, hindari warna pudar, tanpa distorsi..."
                    className="w-full bg-black/50 border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white/50"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-gray-300 mb-1.5">Preset Target AI</label>
                  <select
                    value={promptStyle}
                    onChange={(e) => setPromptStyle(e.target.value)}
                    className="w-full bg-black/50 border border-bordercolor rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-white/50"
                  >
                    <option value="general" className="bg-[#0a0a0a]">General AI Prompt</option>
                    <option value="midjourney" className="bg-[#0a0a0a]">Midjourney v6</option>
                    <option value="flux" className="bg-[#0a0a0a]">Flux.1 AI</option>
                    <option value="sdxl" className="bg-[#0a0a0a]">Stable Diffusion XL (SDXL)</option>
                  </select>
                </div>

                <button
                  onClick={handleGenerate}
                  disabled={isLoading}
                  className="w-full bg-white/20 hover:bg-white/30 disabled:opacity-50 border border-bordercolor text-white font-bold py-3.5 rounded-xl transition shadow-lg flex items-center justify-center gap-2 text-sm"
                >
                  {isLoading ? (
                    <>
                      <i className="fa-solid fa-spinner animate-spin"></i>
                      <span>Menganalisis Visual...</span>
                    </>
                  ) : (
                    <>
                      <i className="fa-solid fa-wand-magic-sparkles"></i>
                      <span>Hasilkan Prompt</span>
                    </>
                  )}
                </button>
              </div>

              {error && (
                <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-3.5 rounded-xl text-xs flex items-center gap-2">
                  <i className="fa-solid fa-circle-exclamation text-base"></i>
                  <span>{error}</span>
                </div>
              )}

            </div>

            {/* RIGHT COLUMN: OUTPUT & HISTORY */}
            <div className="lg:col-span-6 space-y-5">
              
              {/* Output Result */}
              <div className="bg-white/5 border border-bordercolor rounded-2xl p-5 space-y-3 min-h-[300px] flex flex-col">
                <div className="flex items-center justify-between border-b border-bordercolor pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-terminal text-gray-300"></i>
                    Prompt Hasil
                  </h3>
                  {promptResult && (
                    <button
                      onClick={() => copyPromptText(promptResult)}
                      className={`text-xs px-3 py-1.5 rounded-lg border font-semibold transition flex items-center gap-1.5 ${copiedPrompt ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-white/10 text-white border-bordercolor hover:bg-white/20'}`}
                    >
                      <i className={`fa-solid ${copiedPrompt ? 'fa-check' : 'fa-copy'}`}></i>
                      <span>{copiedPrompt ? 'Tersalin' : 'Salin Prompt'}</span>
                    </button>
                  )}
                </div>

                <div className="flex-1 bg-black/50 border border-bordercolor rounded-xl p-4 font-mono text-xs text-gray-200 leading-relaxed overflow-y-auto max-h-[350px]">
                  {promptResult ? promptResult : <span className="text-gray-500 italic">Menunggu Analisis... Prompt akan muncul di sini.</span>}
                </div>
              </div>

              {/* History */}
              <div className="bg-white/5 border border-bordercolor rounded-2xl p-5 space-y-3">
                <div className="flex items-center justify-between border-b border-bordercolor pb-3">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-clock-rotate-left text-gray-400"></i>
                    Riwayat ({history.length})
                  </h3>
                  {history.length > 0 && (
                    <button
                      onClick={() => { setHistory([]); localStorage.removeItem('pv_prompt_history'); }}
                      className="text-[11px] text-gray-400 hover:text-red-400 transition"
                    >
                      Bersihkan
                    </button>
                  )}
                </div>

                <div className="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                  {history.length === 0 ? (
                    <p className="text-xs text-gray-500 italic text-center py-4">Riwayat prompt masih kosong.</p>
                  ) : (
                    history.map((item, idx) => (
                      <div key={idx} className="bg-black/50 border border-bordercolor p-3 rounded-xl flex items-center justify-between gap-3 hover:border-white/30 transition">
                        <div className="min-w-0 flex-1">
                          <p className="text-xs text-gray-300 truncate font-mono">{item.prompt}</p>
                          <span className="text-[10px] text-gray-500">{item.time}</span>
                        </div>
                        <button
                          onClick={() => copyPromptText(item.prompt)}
                          className="text-xs bg-white/10 p-2 rounded-lg text-gray-300 hover:text-white hover:bg-white/20 transition shrink-0"
                          title="Salin"
                        >
                          <i className="fa-solid fa-copy"></i>
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>

          </main>

          {/* BLUE ACCENT SETTINGS MODAL */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#0a0a0a] border border-bordercolor rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl flex flex-col">
                
                {/* Modal Header */}
                <div className="p-5 flex items-center justify-between border-b border-bordercolor">
                  <div className="flex items-center space-x-3">
                    <div className="w-10 h-10 bg-white/10 border border-bordercolor rounded-xl flex items-center justify-center text-white">
                      <i className="fa-solid fa-key text-lg"></i>
                    </div>
                    <div>
                      <h3 className="text-sm font-bold tracking-wider text-white uppercase">PENGATURAN API KEY</h3>
                      <p className="text-[11px] text-gray-400 tracking-wide uppercase">GOOGLE AI STUDIO</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowApiKeyModal(false)}
                    className="text-gray-400 hover:text-white p-2 text-lg transition"
                  >
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Modal Content */}
                <div className="p-5 space-y-5 overflow-y-auto max-h-[75vh]">
                  
                  {/* Info Box */}
                  <div className="bg-white/5 border border-bordercolor rounded-xl p-3.5 text-xs text-gray-300 flex items-start space-x-3 leading-relaxed">
                    <div className="w-5 h-5 rounded-full bg-white/10 text-white flex items-center justify-center shrink-0 mt-0.5">
                      <i className="fa-solid fa-exclamation text-xs"></i>
                    </div>
                    <div>
                      Tambahkan satu atau lebih API Key dari{' '}
                      <a
                        href="https://aistudio.google.com/app/apikey"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-white font-semibold underline hover:text-gray-300 inline-flex items-center gap-1"
                      >
                        Google AI Studio <i className="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                      </a>
                      . Jika satu key rate-limited, sistem akan otomatis mencoba key berikutnya.
                    </div>
                  </div>

                  {/* Saved Keys Section */}
                  <div className="space-y-2">
                    <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                      {apiKeys.length} KEY TERSIMPAN
                    </h4>

                    {apiKeys.length === 0 ? (
                      <div className="p-4 bg-black/50 border border-bordercolor rounded-xl text-center text-xs text-gray-500 italic">
                        Belum ada API Key yang tersimpan.
                      </div>
                    ) : (
                      <div className="space-y-2">
                        {apiKeys.map((keyItem, index) => (
                          <div
                            key={index}
                            className="bg-white/5 border border-bordercolor hover:border-white/30 rounded-xl p-3.5 flex items-center justify-between gap-3"
                          >
                            <div className="flex items-center space-x-3 min-w-0">
                              <div className="w-7 h-7 bg-white/10 border border-bordercolor rounded-lg flex items-center justify-center text-white font-bold text-xs shrink-0">
                                {index + 1}
                              </div>
                              <div className="min-w-0">
                                <p className="text-xs font-bold text-white">Key {index + 1}</p>
                                <p className="text-[11px] font-mono text-gray-400 truncate">
                                  {visibleKeysMap[index] ? keyItem : maskKeyStr(keyItem)}
                                </p>
                              </div>
                            </div>

                            <div className="flex items-center space-x-2 shrink-0">
                              {/* Copy */}
                              <button
                                type="button"
                                onClick={() => copyKeyToClipboard(keyItem, index)}
                                className="p-2 text-gray-400 hover:text-white transition"
                                title="Salin Key"
                              >
                                <i className={`fa-solid ${copiedKeyIndex === index ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                              </button>

                              {/* View / Mask */}
                              <button
                                type="button"
                                onClick={() => toggleKeyVisibility(index)}
                                className="p-2 text-gray-400 hover:text-white transition"
                                title={visibleKeysMap[index] ? 'Sembunyikan' : 'Lihat'}
                              >
                                <i className={`fa-solid ${visibleKeysMap[index] ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                              </button>

                              {/* Delete */}
                              <button
                                type="button"
                                onClick={() => handleRemoveKey(index)}
                                className="p-2 text-gray-400 hover:text-red-400 transition"
                                title="Hapus Key"
                              >
                                <i className="fa-solid fa-trash-can"></i>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  {/* Add New Key Section */}
                  <div className="space-y-2 pt-1">
                    <h4 className="text-[11px] font-bold text-gray-400 uppercase tracking-wider">TAMBAH KEY BARU</h4>
                    
                    <form onSubmit={handleAddKey} className="space-y-3">
                      <div className="relative">
                        <input
                          type={showInputKeyText ? 'text' : 'password'}
                          value={newKeyInput}
                          onChange={(e) => setNewKeyInput(e.target.value)}
                          placeholder="AIza... (paste API Key di sini)"
                          className="w-full bg-black/50 border border-bordercolor focus:border-white/50 rounded-xl px-4 py-3 text-xs text-white placeholder-gray-500 outline-none pr-10 font-mono transition"
                        />
                        <button
                          type="button"
                          onClick={() => setShowInputKeyText(!showInputKeyText)}
                          className="absolute right-3 top-3.5 text-gray-400 hover:text-white text-xs"
                        >
                          <i className={`fa-solid ${showInputKeyText ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                        </button>
                      </div>

                      <button
                        type="submit"
                        disabled={!newKeyInput.trim()}
                        className="w-full bg-white/10 hover:bg-white/20 disabled:opacity-40 border border-bordercolor text-gray-200 hover:text-white font-bold py-3 rounded-xl text-xs transition flex items-center justify-center gap-2"
                      >
                        <i className="fa-solid fa-plus"></i>
                        <span>Tambah Key</span>
                      </button>
                    </form>
                  </div>

                  {/* Free API Text Helper */}
                  <div className="text-center text-xs text-gray-400 pt-1 border-t border-bordercolor/60">
                    Belum punya API key?{' '}
                    <a
                      href="https://aistudio.google.com/app/apikey"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="text-white font-semibold underline hover:text-gray-300"
                    >
                      Dapatkan gratis di Google AI Studio
                    </a>
                  </div>

                </div>

                {/* Modal Footer Bar */}
                <div className="bg-black/50 border-t border-bordercolor py-3 px-5 text-center">
                  <span className="text-[11px] text-gray-500 font-mono">
                    {apiKeys.length}/15 key • Model: gemini-3.6-flash / gemini-2.5-flash
                  </span>
                </div>

              </div>
            </div>
          )}

          {/* Page Footer */}
          <footer className="border-t border-bordercolor bg-white/5 py-4 text-center text-xs text-gray-500 mt-auto">
            <p>&copy; {new Date().getFullYear()} Image to Prompt — Developed by <a href="https://www.buanamedia.my.id" target="_blank" rel="noopener noreferrer" className="text-gray-300 hover:underline">Buana Media</a>.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
